# Настройки Railway в файле (Config as Code): Railway читает его сам при каждом деплое.
# Проверка живости — /healthz: деплой считается удачным, когда редактор ответил 200.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
