<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NUMBUS Branding</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f0f1f4);
  --fg: var(--tg-theme-text-color, #15171a);
  --hint: var(--tg-theme-hint-color, #8a8f98);
  --accent: var(--tg-theme-button-color, #2e6be6);
  --accent-fg: var(--tg-theme-button-text-color, #ffffff);
  --danger: var(--tg-theme-destructive-text-color, #d23b3b);
  --line: rgba(128, 132, 140, .22);
  --stage: rgba(128, 132, 140, .10);
  --r: 12px;
}
@supports (color: color-mix(in srgb, red, blue)) {
  :root {
    --line: color-mix(in srgb, var(--fg) 13%, transparent);
    --stage: color-mix(in srgb, var(--fg) 5%, var(--bg2));
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg2); color: var(--fg); }
body {
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  overscroll-behavior: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- каркас ---------- */
.top {
  display: flex; gap: 4px; padding: 10px 12px; background: var(--bg2);
  position: sticky; top: 0; z-index: 5;
}
.tab {
  flex: 1; border: 0; background: transparent; padding: 8px 0; border-radius: 9px;
  color: var(--hint); font-weight: 600;
}
.tab[aria-selected="true"] { background: var(--bg); color: var(--fg); }
.section { background: var(--bg); margin: 12px; border-radius: var(--r); padding: 4px 14px; }
.section > h3 { font-size: 13px; font-weight: 600; color: var(--hint); margin: 12px 0 6px; }
.hint { color: var(--hint); font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 48px; }
.section > h3 + .row, .section > .row:first-child { border-top: 0; }
.row > label { flex: 0 0 34%; color: var(--fg); }
.row > .ctl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.row.stacked { flex-wrap: wrap; gap: 8px; }
.row.stacked > label { flex-basis: 100%; }
.val { min-width: 54px; text-align: right; color: var(--hint); font-size: 13px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
input[type=text], textarea, select {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 9px 10px;
}
textarea { resize: vertical; min-height: 64px; }
.btn {
  border: 0; border-radius: 10px; padding: 11px 14px; background: var(--bg2); color: var(--fg); font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--accent); padding-left: 0; padding-right: 0; }
.btn.danger { background: transparent; color: var(--danger); padding-left: 0; }
.btn.block { width: 100%; }
.seg { display: flex; background: var(--bg2); border-radius: 9px; padding: 2px; flex: 1; min-width: 0; }
.seg button {
  flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: 7px; font-size: 13px;
  color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.switch { width: 44px; height: 26px; border-radius: 13px; border: 0; background: var(--line); position: relative; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 21px; }

/* ---------- сцена: главный элемент ---------- */
.stage {
  position: sticky; top: 0; z-index: 4; background: var(--stage);
  padding: 14px 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 24px;
  border-bottom: 1px solid var(--line);
}
.frame { position: relative; line-height: 0; }
.frame canvas { display: block; touch-action: none; box-shadow: 0 0 0 1px var(--line); max-width: 100%; }
/* метки обреза — как на типографском листе */
.frame i { position: absolute; width: 12px; height: 12px; border-color: var(--hint); border-style: solid; border-width: 0; pointer-events: none; }
.frame i:nth-child(1) { left: -16px; top: -16px; border-right-width: 1px; border-bottom-width: 1px; }
.frame i:nth-child(2) { right: -16px; top: -16px; border-left-width: 1px; border-bottom-width: 1px; }
.frame i:nth-child(3) { left: -16px; bottom: -16px; border-right-width: 1px; border-top-width: 1px; }
.frame i:nth-child(4) { right: -16px; bottom: -16px; border-left-width: 1px; border-top-width: 1px; }
.stagebar { display: flex; gap: 8px; width: 100%; max-width: 520px; align-items: center; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 5px 11px; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--fg); font-weight: 600; }

/* ---------- слои ---------- */
.layer { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.layer:first-of-type { border-top: 0; }
.layer .glyph { width: 30px; height: 30px; border-radius: 8px; background: var(--bg2); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: 0 0 auto; }
.layer .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; text-align: left; padding: 4px 0; }
.layer.sel .glyph { background: var(--accent); color: var(--accent-fg); }
.layer.sel .name { font-weight: 600; }
.layer.off .name { color: var(--hint); text-decoration: line-through; }
.icon { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; color: var(--hint); font-size: 16px; flex: 0 0 auto; }

/* ---------- якорь 3×3 ---------- */
.anchor { display: grid; grid-template-columns: repeat(3, 26px); grid-template-rows: repeat(3, 26px); border: 1px solid var(--line); border-radius: 6px; }
.anchor button { border: 0; background: transparent; display: grid; place-items: center; }
.anchor button::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.anchor button[aria-pressed="true"]::after { width: 10px; height: 10px; background: var(--accent); }

/* ---------- цвет ---------- */
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); padding: 0; position: relative; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.sw.custom { background: conic-gradient(#f55, #fd5, #5f8, #5cf, #a6f, #f55); }
.sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.palette { display: flex; gap: 12px; }
.palette .sw { width: 44px; height: 44px; }
.stack { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }

/* ---------- списки ---------- */
.tpl { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.tpl:first-of-type { border-top: 0; }
.tpl canvas { width: 64px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); flex: 0 0 auto; }
.tpl b { display: block; font-weight: 600; }
.asset { display: flex; align-items: center; gap: 12px; }
.asset .thumb { width: 72px; height: 48px; border-radius: 8px; background: #8e929a; display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; }
.asset .thumb.photo { background: var(--bg2); }
.asset .thumb img { max-width: 88%; max-height: 80%; }

/* ---------- лист снизу ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; }
.sheet { background: var(--bg); width: 100%; max-height: 86vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .18s ease-out; }
.sheet h2 { font-size: 17px; margin: 10px 0 12px; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; }
.grid button { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.grid canvas { width: 100%; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
.list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 0; border-top: 1px solid var(--line); }
.list button:first-child { border-top: 0; }
.compare img { width: 100%; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: 90vw; }
.empty { padding: 28px 8px; text-align: center; color: var(--hint); }
.footer-save { position: sticky; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg2); }
.hidden { display: none !important; }
/* ---------- редактор: колонки, режимы, выдвижная панель ---------- */
.col-stage { display: contents; }
.col-side { min-width: 0; }
.modes { display: flex; gap: 8px; align-items: center; padding: 12px 12px 0; }
.modes .seg { flex: 1; }
.icon.big { font-size: 20px; color: var(--fg); }
.icon:disabled { opacity: .3; }
.pts { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); border: 1px solid var(--line); border-radius: 8px; }
.pts button { border: 0; background: transparent; display: grid; place-items: center; }
.pts button::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.pts button[aria-pressed="true"]::after { width: 12px; height: 12px; background: var(--accent); }
.drawer-head { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.drawer-head h3 { flex: 1; margin: 6px 0; }
@media (max-width: 899px) {
  .stage { padding: 8px 16px 10px; gap: 12px; }
  #props.drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; margin: 0; max-height: 46vh; overflow: auto;
    border-radius: 16px 16px 0 0; box-shadow: 0 -1px 0 var(--line), 0 -12px 32px rgba(0,0,0,.12);
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #props.drawer.empty { display: none; }
  #app.has-drawer .col-side { padding-bottom: 48vh; }
}
@media (min-width: 900px) {
  #app { max-width: 760px; margin: 0 auto; }
  #app.editor { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) 460px; height: 100vh; }
  #app.editor .col-stage { display: block; height: 100vh; overflow: hidden; }
  #app.editor .stage { position: static; height: 100%; justify-content: center; border-bottom: 0; border-right: 1px solid var(--line); }
  #app.editor .col-side { height: 100vh; overflow: auto; }
  body.browser { padding-bottom: 0; }
}
/* ---------- загрузка ---------- */
.boot { min-height: 70vh; display: grid; place-content: center; text-align: center; }
.boot b { font-size: 22px; letter-spacing: .32em; padding-left: .32em; font-weight: 700; animation: breathe 1.6s ease-in-out infinite; }
.boot p { color: var(--hint); font-size: 14px; max-width: 320px; margin: 14px auto 0; }
@keyframes breathe { 50% { opacity: .35; } }
/* ---------- готовые стили ---------- */
.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 0 12px; }
.looks button { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.looks canvas { width: 100%; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
/* ---------- палитра, логотип, шрифты ---------- */
.palette { flex-wrap: wrap; }
.pal { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 58px; font-size: 11px; line-height: 1.2; color: var(--hint); text-align: center; }
.chipsrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 6px 0 10px; }
.logo-pair { display: flex; gap: 6px; flex: 0 0 auto; }
.logo-pair .thumb { width: 60px; height: 44px; }
.asset .thumb.light { background: #f4f2ee; }
.asset .thumb.dark { background: #1b1b1d; }
.sample-line { font-size: 20px; line-height: 1.25; overflow-wrap: anywhere; }
.warn { color: var(--danger); font-size: 13px; }
.note { margin: 0; padding: 8px 12px; border-radius: 9px; background: var(--bg); font-size: 13px; max-width: 520px; box-shadow: 0 0 0 1px var(--line); }
.tbtn { border: 0; background: transparent; color: var(--hint); font-size: 12px; padding: 4px 6px; border-radius: 6px; flex: 0 0 auto; }
.stagebar .chip:disabled { opacity: .35; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .switch::after { transition: none; } .boot b { animation: none; } }
</style>
</head>

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
function toast(msg) {
  const el = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(el);
  setTimeout(() => el.remove(), 2200);
}
function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
function confirmBox(msg) {
  return new Promise(res => {
    if (tg && tg.showConfirm) { try { return tg.showConfirm(msg, ok => res(!!ok)); } catch (e) {} }
    res(window.confirm(msg));
  });
}

async function api(method, path, body, isForm) {
  const url = `/api/${path}${path.includes("?") ? "&" : "?"}b=${encodeURIComponent(BID)}`;
  const headers = IN_TG ? { "X-Init-Data": INIT } : { "X-Session": SESSION };
  if (body && !isForm) headers["Content-Type"] = "application/json";
  let r;
  try {
    r = await fetch(url, { method, headers, body: isForm ? body : body ? JSON.stringify(body) : undefined });
  } catch (e) { const err = new Error("net"); err.code = "net"; throw err; }
  if (!r.ok) {
    let code = "http" + r.status;
    try { code = (await r.json()).error || code; } catch (e) {}
    const err = new Error(code); err.code = code; err.status = r.status; throw err;
  }
  return r;
}
function errText(e) {
  if (e.code === "auth" && !IN_TG) return t("errLogin");
  if (e.code && TT.ru["e_" + e.code]) return t("e_" + e.code);
  return ({ net: t("errNet"), auth: t("errAuth"), owner_only: t("errOwner"), logo_bad: t("errLogo"), rate: t("errRate"),
            logo_empty: t("errLogoEmpty"), font_bad: t("errFont"), photo_bad: t("errPhoto"), limit: t("errLimit") })[e.code] || t("errNet");
}
async function blobImage(blob) {
  const url = URL.createObjectURL(blob);

  img.src = url;
  await img.decode();
  return img;
}

function hexRgb(s) {
  s = String(s || "").replace("#", "");
  const v = [0, 2, 4].map(i => parseInt(s.slice(i, i + 2), 16));
  return v.some(isNaN) ? [255, 255, 255] : v;
}
function ref(env, v, d) {
  v = v || d;
  if (/^p[0-4]$/.test(v)) v = env.palette[+v[1]] || d;
  return hexRgb(v);
}
function avgColor(ctx, box) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const x0 = Math.max(0, Math.trunc(box[0])), y0 = Math.max(0, Math.trunc(box[1]));
  const x1 = Math.min(Math.trunc(box[0] + box[2]), W), y1 = Math.min(Math.trunc(box[1] + box[3]), H);
  if (x1 <= x0 || y1 <= y0) return [0, 0, 0];
  const d = ctx.getImageData(x0, y0, x1 - x0, y1 - y0).data;
  let r = 0, g = 0, b = 0;
  const n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  return [r / n, g / n, b / n];
}
const luma = (r, g, b) => (r * 299 + g * 587 + b * 114) / 1000;
function shiftTone(r, g, b, pct) {
  const f = pct > 0 ? c => c + (255 - c) * pct / 100 : c => c - c * (-pct) / 100;
  return [r, g, b].map(c => Math.min(255, Math.max(0, Math.round(f(c)))));
}
function resolveColor(spec, env, ctx, box) {
  spec = spec || { mode: "fixed", value: "#FFFFFF" };
  const mode = spec.mode || "fixed";
  if (mode === "original") return null;
  if (mode === "fixed") return ref(env, spec.value, "#FFFFFF");
  const [r, g, b] = avgColor(ctx, box);
  const darkBg = luma(r, g, b) < 128;
  if (mode === "contrast") return darkBg ? ref(env, spec.light, "#FFFFFF") : ref(env, spec.dark, "#000000");
  return shiftTone(r, g, b, darkBg ? 45 : -45);
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function place(anchor, x, y, w, h, W, H) {
  const v = (anchor || "bl")[0], hz = (anchor || "bl")[1];
  const left = hz === "l" ? x * W : hz === "r" ? W - x * W - w : W / 2 + x * W - w / 2;
  const top = v === "t" ? y * W : v === "b" ? H - y * W - h : H / 2 + y * W - h / 2;
  return [left, top];
}
function rrPath(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const FONT_STATE = { loaded: new Set(), pending: {}, faces: {} };
function fontInfo(key) {
  const list = (APP.state && APP.state.fonts) || [];
  return list.find(f => f.key === key) || list.find(f => f.key === "inter") || { key: "inter", min: 100, max: 900 };
}
function fontKey(key) {
  const f = fontInfo(key);
  return f.custom && !FONT_STATE.loaded.has(f.key) ? "inter" : f.key;
}
function ensureFont(key) {
  const f = fontInfo(key);
  if (FONT_STATE.loaded.has(f.key)) return Promise.resolve();
  if (FONT_STATE.pending[f.key]) return FONT_STATE.pending[f.key];
  const p = (async () => {
    let src;
    if (f.custom) src = await (await api("GET", `font/${f.key}`)).arrayBuffer();
    else src = `url(/fonts/${f.file})`;
    const face = new FontFace("nb-" + f.key, src, { weight: `${f.min} ${f.max}` });
    await face.load();
    if (FONT_STATE.faces[f.key]) document.fonts.delete(FONT_STATE.faces[f.key]);   // шрифт в слоте заменили
    FONT_STATE.faces[f.key] = face;
    document.fonts.add(face);
    FONT_STATE.loaded.add(f.key);
  })().catch(e => { console.warn("font", f.key, e); FONT_STATE.loaded.add(f.key); })
      .finally(() => { delete FONT_STATE.pending[f.key]; });
  FONT_STATE.pending[f.key] = p;
  return p;
}
function fontsOf(layers) {
  return [...new Set(["inter", ...(layers || []).filter(L => L.type === "text" && !L.hidden).map(L => L.font)])];
}
const qsize = s => Math.max(1, Math.round(s * 2) / 2);
// Знаки, которых нет в шрифте (₽ в Playfair, № в Jost), браузер берёт из Inter — так же делает сервер
function setFont(ctx, key, weight, size) {
  ctx.font = `${Math.trunc(weight || 400)} ${qsize(size)}px "nb-${key}", "nb-inter", sans-serif`;
}

function logoIsDark(img) {
  if (img._dark != null) return img._dark;
  try {
    const c = document.createElement("canvas");
    c.width = 64; c.height = Math.max(1, Math.round(64 * img.naturalHeight / img.naturalWidth));
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height).data;
    let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 128) { sum += luma(d[i], d[i + 1], d[i + 2]); n++; }
    img._dark = n > 0 && sum / n < 90;
  } catch (e) { img._dark = false; }
  return img._dark;
}

/* ============================================================
   РЕДАКТОР ШАБЛОНА
   ============================================================ */
const HIST = { past: [], future: [], last: null, t: 0 };
function histReset() { HIST.past = []; HIST.future = []; HIST.last = JSON.stringify(APP.tpl); HIST.t = 0; updateUndoUI(); }
function histRecord() {
  const cur = JSON.stringify(APP.tpl);
  if (cur === HIST.last) return;
  const now = Date.now();
  // изменения подряд (перетаскивание, ползунок) — один шаг истории
  if (now - HIST.t > 600) {
    HIST.past.push(HIST.last);
    if (HIST.past.length > 80) HIST.past.shift();
    HIST.future = [];
  }
  HIST.last = cur;
  HIST.t = now;
  updateUndoUI();
}
function histRestore(json) {
  APP.tpl = JSON.parse(json);
  HIST.last = json;
  HIST.t = 0;
  if (!layers().some(L => L.id === APP.sel)) APP.sel = null;
  APP.dirty = true;
  const y = window.scrollY, side = document.querySelector(".col-side"), sy = side ? side.scrollTop : 0;
  go("editor");
  window.scrollTo(0, y);
  const side2 = document.querySelector(".col-side");
  if (side2) side2.scrollTop = sy;
}
function undo() { if (!HIST.past.length) return; HIST.future.push(JSON.stringify(APP.tpl)); histRestore(HIST.past.pop()); }
function redo() { if (!HIST.future.length) return; HIST.past.push(JSON.stringify(APP.tpl)); histRestore(HIST.future.pop()); }
function updateUndoUI() {
  const u = document.getElementById("undo"), r = document.getElementById("redo");
  if (u) u.disabled = !HIST.past.length;
  if (r) r.disabled = !HIST.future.length;
}
function openEditor(tp) {
  APP.tpl = clone(tp);
  APP.slide = 1;
  histReset();
  APP.dirty = false;
  APP.surface = "feed";
  APP.sel = null;
  APP.localPhoto = null;
  go("editor");
}
function surf() { return APP.surface === "story" ? APP.tpl.spec.story : APP.tpl.spec.feed; }
function layers() { return surf().layers; }
function selLayer() { return layers().find(L => L.id === APP.sel) || null; }
function dims() {
  if (APP.surface === "story") return STORY_SIZE;
  return FEED_SIZES[APP.fmt] || FEED_SIZES["4:5"];
}
function markDirty() {
  histRecord();
  if (!APP.dirty) { APP.dirty = true; updateSaveUI(); }
  schedule();
}
function schedule() {
  if (APP.raf) return;
  APP.raf = requestAnimationFrame(() => { APP.raf = 0; draw(); });
}
function draw() {
  const cv = document.getElementById("stage");
  if (!cv) return;
  const L = layers();
  const need = fontsOf(L).filter(k => !FONT_STATE.loaded.has(fontInfo(k).key));
  if (need.length) { Promise.all(need.map(ensureFont)).then(schedule); }
  const needImg = imagesOf(L).filter(a => !IMG_STATE.map.has(a));
  if (needImg.length) { Promise.all(needImg.map(ensureImage)).then(schedule); }
  const [W, H] = dims();
  const e = env();
  APP.boxes = renderSurface(cv, W, H, photoFor(), L, e);
  APP.notes = e.notes;
  const note = document.getElementById("note");
  if (note) {
    const msg = e.notes.has("title_cut") ? t("noteCut") : e.notes.has("title_small") ? t("noteSmall") : "";
    note.textContent = msg;
    note.classList.toggle("hidden", !msg);
  }
  const ctx = cv.getContext("2d");
  const lw = Math.max(2, W / 360);
  if (APP.safe && APP.mode === "designer") drawSafe(ctx, W, H, lw);
  if (APP.guides) {
    const M = ((APP.state.safe && APP.state.safe.margin) || 0.06) * W;
    const line = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
    ctx.save(); ctx.strokeStyle = "#ff3bd4"; ctx.lineWidth = lw;
    if (APP.guides.v) line(W / 2, 0, W / 2, H);
    if (APP.guides.h) line(0, H / 2, W, H / 2);
    if (APP.guides.ml) line(M, 0, M, H);
    if (APP.guides.mr) line(W - M, 0, W - M, H);
    if (APP.guides.mt) line(0, M, W, M);
    if (APP.guides.mb) line(0, H - M, W, H - M);
    if (APP.guides.st) line(0, APP.guides.st, W, APP.guides.st);
    ctx.restore();
  }
  const b = APP.sel && APP.boxes[APP.sel];
  const S = selLayer();
  if (b && S && !(S.type === "gradient" || S.type === "overlay" || (S.type === "image" && S.fit !== "box"))) {
    ctx.save();
    ctx.setLineDash([lw * 4, lw * 3]);
    ctx.lineWidth = lw;
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#2e6be6";
    ctx.strokeRect(b[0] - lw, b[1] - lw, b[2] + 2 * lw, b[3] + 2 * lw);
    ctx.restore();
  }
  fitStage();
}
// Безопасные зоны: в сторис верх 14% и низ 35% закрывают кнопки и подпись; в ленте пунктир — обрез
// в сетке профиля 3:4, тонкие линии — поля бренда (6% от края)
function drawSafe(ctx, W, H, lw) {
  const M = ((APP.state.safe && APP.state.safe.margin) || 0.06) * W;
  ctx.save();
  if (APP.surface === "story") {
    ctx.fillStyle = "rgba(255, 59, 212, 0.16)";
    ctx.fillRect(0, 0, W, H * 0.14);
    ctx.fillRect(0, H * 0.65, W, H * 0.35);
  } else {
    const gw = H * 3 / 4;                      // ширина кадра, которую видно в сетке профиля
    if (gw < W - 1) {
      ctx.setLineDash([lw * 5, lw * 4]);
      ctx.strokeStyle = "rgba(255, 59, 212, 0.9)"; ctx.lineWidth = lw;
      const x0 = (W - gw) / 2;
      ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.moveTo(W - x0, 0); ctx.lineTo(W - x0, H); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  ctx.strokeStyle = "rgba(255, 59, 212, 0.55)"; ctx.lineWidth = Math.max(1, lw / 2);
  ctx.strokeRect(M, M, W - 2 * M, H - 2 * M);
  ctx.restore();
}
const DESKTOP = window.matchMedia("(min-width: 900px)");
function fitStage() {

    if (pts.size < 2 && pinch) { pinch = null; renderProps(); }
    if (!APP.drag) return;
    APP.drag = null;
    APP.guides = null;
    renderProps();
    schedule();
  };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  // Щипок на тачпаде (приходит как wheel + ctrl) и Ctrl/⌘ + колесо
  let wheelTimer = 0;
  cv.addEventListener("wheel", e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const L = selLayer();
    if (!scalable(L)) return;
    e.preventDefault();
    applyScale(L, sizeOf(L), Math.exp(-e.deltaY * 0.01));
    markDirty();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(renderProps, 250);
  }, { passive: false });
}

/* ---------- клавиатура на компьютере ---------- */
document.addEventListener("keydown", e => {
  if (APP.screen !== "editor" || !APP.tpl) return;
  const tag = (e.target && e.target.tagName) || "";
  const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); if (APP.dirty) saveTemplate(); return; }
  if (typing) return;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  const L = selLayer();
  if (!L) return;
  if (e.key === "Escape") { APP.sel = null; renderLayerList(); renderProps(); schedule(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && APP.mode === "designer") {
    e.preventDefault();
    const arr = layers(); arr.splice(arr.indexOf(L), 1); APP.sel = null; markDirty(); renderLayerList(); renderProps();
    return;
  }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[e.key] && movable(L)) {
    e.preventDefault();
    const step = (e.shiftKey ? 10 : 1) / dims()[0];        // 1 px (или 10) на холсте
    const [dx, dy] = arrows[e.key];
    const hz = L.anchor[1], v = L.anchor[0];
    L.x = Math.round(((L.x || 0) + (hz === "r" ? -dx : dx) * step) * 10000) / 10000;
    L.y = Math.round(((L.y || 0) + (v === "b" ? -dy : dy) * step) * 10000) / 10000;
    markDirty();
    clearTimeout(APP._nudge);
    APP._nudge = setTimeout(renderProps, 250);
  }
});

/* ---------- проверка итогом сервера, дублирование, удаление ---------- */
async function serverCheck() {
  const box = h("div", { class: "compare" }, h("p", { class: "hint" }, "…"));
  sheet(t("check"), box);
  try {
    const blob = await (await api("POST", "preview", {
      spec: APP.tpl.spec, surface: APP.surface, fmt: APP.fmt, i: APP.slide || 1, n: 8,
      fields: { title: APP.fields.title, subtitle: APP.fields.subtitle, hashtag: APP.fields.hashtag },
    })).blob();
    const img = await blobImage(blob);
    box.innerHTML = "";
    box.append(img, h("p", { class: "hint" }, t("checkCap")));
  } catch (e) { box.innerHTML = ""; box.append(h("p", {}, errText(e))); }
}
async function duplicateTemplate() {
  try {
    const created = await (await api("POST", "templates", { name: `${APP.tpl.name} 2`.slice(0, 40), spec: APP.tpl.spec })).json();
    APP.state.templates.push(created);
    openEditor(created);
    toast(t("saved"));
  } catch (e) { toast(errText(e)); }
}
async function deleteTemplate() {
  if (!(await confirmBox(t("confirmDel")))) return;
  try {
    await api("DELETE", `templates/${APP.tpl.id}`);
    APP.state.templates = APP.state.templates.filter(x => x.id !== APP.tpl.id);
    APP.dirty = false;
    APP.tpl = null;
    go("templates");
  } catch (e) { toast(errText(e)); }
}

/* ---------- старт ---------- */
window.addEventListener("resize", () => APP.screen === "editor" && fitStage());
(async function boot() {
  if (IN_TG) {
    try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  } else {
    // Браузер: одноразовая ссылка из бота (?k=…) меняется на сессию, она живёт 7 дней
    document.body.classList.add("browser");
    const key = "nb_session_" + BID;
    const k = QS.get("k");
    if (k) {
      try {
        const r = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ k }) });
        if (r.ok) { const j = await r.json(); try { localStorage.setItem(key, j.session); } catch (e) { SESSION = j.session; } }
      } catch (e) {}
      QS.delete("k");
      history.replaceState(null, "", location.pathname + "?" + QS.toString());
    }
    try { SESSION = SESSION || localStorage.getItem(key) || ""; } catch (e) {}
  }
  try {
    await loadState();
    go("templates");
  } catch (e) {
    const b = document.getElementById("boot") || root();
    b.innerHTML = "";
    b.append(h("b", { style: "animation:none" }, "NUMBUS"), h("p", {}, errText(e)));
  }
})();
window.NB = { renderSurface, ensureFont, fontsOf, ensureImage, imagesOf, IMG_STATE, APP, importSheet };
</script>
